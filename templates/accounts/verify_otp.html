<!-- templates/accounts/verify_otp.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 rounded-4 text-center p-4" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <div class="mb-4 text-primary">
                <i class="bi bi-envelope-check-fill display-1"></i>
            </div>
            <h3 class="fw-bold mb-2">Verify Email</h3>
            <p class="text-muted small mb-4">We sent a 6-digit code to your email. Enter it below to confirm your account.</p>

            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mb-4" id="otp-container">
                    {% for i in "123456" %}
                    <input type="text" name="otp_{{ i }}" class="form-control text-center fw-bold fs-4 border-primary otp-input" 
                           maxlength="1" style="width: 45px; height: 50px;" required>
                    {% endfor %}
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-pill">
                    Verify & Login
                </button>
            </form>

            <p class="mt-4 text-muted small">
                Didn't receive code? <a href="{% url 'signup' %}" class="text-decoration-none">Resend</a>
            </p>
        </div>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.otp-input');

    inputs.forEach((input, index) => {
        // Forward Typing: Type karne par agle field me shift karega
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, ''); // Allow only numbers
            if (e.target.value !== '' && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        // Backspace Navigation: Backspace dabane par pichle box me jayega
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });
</script>
{% endblock %}
